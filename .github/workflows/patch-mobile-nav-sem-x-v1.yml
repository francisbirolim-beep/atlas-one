name: Patch Mobile Nav Sem X V1

on:
  push:
    branches:
      - fix/mobile-nav-sem-x-v1
    paths:
      - '.github/workflows/patch-mobile-nav-sem-x-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-sem-x-v1

      - name: Ajustar sidebar e mobile
        shell: python
        run: |
          from pathlib import Path
          path = Path('components/Sidebar.tsx')
          text = path.read_text(encoding='utf-8')

          # Remove X dos favoritos no desktop
          import re
          text = re.sub(r'''\n\s*<button\n\s*onClick=\{\(e\) => removerFavorito\(e, g\.href\)\}.*?<\/button>''', '', text, flags=re.S)
          text = re.sub(r'''\n\s*<button\n\s*onClick=\{\(e\) => removerFavoritoSetor\(e, s\.id\)\}.*?<\/button>''', '', text, flags=re.S)

          # Remove X dos favoritos no mobile
          text = re.sub(r'''\n\s*<button\n\s*onClick=\{\(e\) => removerFavorito\(e, g\.href\)\}.*?<\/button>''', '', text, flags=re.S)
          text = re.sub(r'''\n\s*<button\n\s*onClick=\{\(e\) => removerFavoritoSetor\(e, s\.id\)\}.*?<\/button>''', '', text, flags=re.S)

          # Remove funcoes que ficaram sem uso
          text = re.sub(r'''\n\s*function removerFavorito\(e: React\.MouseEvent, href: string\) \{.*?\n\s*\}''', '', text, flags=re.S)
          text = re.sub(r'''\n\s*function removerFavoritoSetor\(e: React\.MouseEvent, id: string\) \{.*?\n\s*\}''', '', text, flags=re.S)

          # Barra inferior mais segura para muitos favoritos e aparelhos com area segura
          old_nav = '''className="fixed bottom-0 left-0 right-0 z-40 flex items-center justify-around border-t border-slate-200 bg-white px-2 py-1.5
                   md:static md:h-screen md:w-56 md:flex-col md:items-stretch md:justify-start md:gap-0 md:border-r md:border-t-0 md:py-5"'''
          new_nav = '''className="fixed bottom-0 left-0 right-0 z-40 flex items-center justify-start gap-1 overflow-x-auto border-t border-slate-200 bg-white px-2 pt-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))]
                   md:static md:h-screen md:w-56 md:flex-col md:items-stretch md:justify-start md:gap-0 md:overflow-visible md:border-r md:border-t-0 md:py-5"'''
          text = text.replace(old_nav, new_nav, 1)

          # Evita que botoes encolham ou fiquem dificeis de tocar no mobile
          text = text.replace('className={`flex h-14 w-14 flex-col items-center justify-center gap-1 rounded-xl transition', 'className={`flex h-14 w-16 flex-shrink-0 flex-col items-center justify-center gap-1 rounded-xl transition')
          text = text.replace('className="flex h-14 w-14 flex-col items-center justify-center gap-1 rounded-xl text-slate-400 transition hover:bg-slate-100 md:hidden"', 'className="flex h-14 w-16 flex-shrink-0 flex-col items-center justify-center gap-1 rounded-xl text-slate-400 transition hover:bg-slate-100 md:hidden"')
          text = text.replace('className="flex h-14 w-14 flex-col items-center justify-center gap-1 rounded-xl text-slate-400 transition hover:bg-slate-100 hover:text-red-500 md:hidden"', 'className="flex h-14 w-16 flex-shrink-0 flex-col items-center justify-center gap-1 rounded-xl text-slate-400 transition hover:bg-slate-100 hover:text-red-500 md:hidden"')

          path.write_text(text, encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-one-bot"
          git config user.email "actions@github.com"
          git add components/Sidebar.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remover X dos favoritos e melhorar navegacao mobile"
          git push origin HEAD:fix/mobile-nav-sem-x-v1
