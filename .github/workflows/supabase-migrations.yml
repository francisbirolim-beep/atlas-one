name: Supabase Database Control

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-migrations.yml'
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "Acao no banco"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - dry-run
          - apply
      confirmation:
        description: "Para apply em producao, digite APPLY_PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: supabase-database-control-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  database:
    name: Supabase migration control
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "ERRO: SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "ERRO: SUPABASE_DB_PASSWORD ausente"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "ERRO: SUPABASE_PROJECT_ID ausente"; exit 1; }
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "ERRO: SUPABASE_PROJECT_ID nao tem o formato esperado de project ref (20 caracteres alfanumericos)."
            exit 1
          fi
          echo "Secrets presentes e Project ID com formato valido."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        shell: bash
        run: supabase --version

      - name: Validate access token
        shell: bash
        run: |
          set -euo pipefail
          echo "Validando autenticacao do SUPABASE_ACCESS_TOKEN..."
          if ! supabase projects list --output json > /tmp/supabase-projects.json; then
            echo "ERRO: o SUPABASE_ACCESS_TOKEN nao autenticou na Supabase CLI. Gere/atualize o token e tente novamente."
            exit 1
          fi
          echo "Token autenticado com sucesso."

      - name: Validate target project visibility
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e --arg ref "$SUPABASE_PROJECT_ID" 'any(.[]; (.id // .ref // .project_ref) == $ref)' /tmp/supabase-projects.json >/dev/null; then
            echo "ERRO: o projeto configurado em SUPABASE_PROJECT_ID nao esta visivel para o token informado."
            echo "Confira se o token pertence a mesma conta/organizacao do projeto Atlas One e se o Project ID foi atualizado no secret."
            exit 1
          fi
          echo "Projeto alvo encontrado na conta autenticada."

      - name: Build IPv4 session pooler URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os
          import urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "Session Pooler IPv4 configurado."

      - name: TEMP reconcile remote migrations into branch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          recover() {
            version="$1"
            filename="$2"
            if [ -f "supabase/migrations/${filename}" ]; then
              return 0
            fi
            psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
              -c "select statements[1] from supabase_migrations.schema_migrations where version='${version}'" \
              > "supabase/migrations/${filename}"
            test -s "supabase/migrations/${filename}" || { echo "Migration ${version} vazia ou ausente"; exit 1; }
          }
          recover 20260826005744 20260826005744_balcao_venda_sem_estoque_v1.sql
          recover 20260826013513 20260826013513_orcamento_balcao_condicoes_comerciais_v1.sql
          recover 20260826014745 20260826014745_orcamento_balcao_local_obra_v1.sql
          recover 20260826040819 20260826040819_balcao_venda_sem_caixa_configuravel_v1.sql
          recover 20260826134514 20260826134514_isolar_balcao_do_kanban_v1.sql
          git diff --check
          git config user.name "atlas-migration-reconcile"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260826005744_balcao_venda_sem_estoque_v1.sql \
                  supabase/migrations/20260826013513_orcamento_balcao_condicoes_comerciais_v1.sql \
                  supabase/migrations/20260826014745_orcamento_balcao_local_obra_v1.sql \
                  supabase/migrations/20260826040819_balcao_venda_sem_caixa_configuravel_v1.sql \
                  supabase/migrations/20260826134514_isolar_balcao_do_kanban_v1.sql
          if ! git diff --cached --quiet; then
            git commit -m "db: recuperar migrations aplicadas no Supabase"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Audit migration history
        shell: bash
        run: |
          set -euo pipefail
          echo "Lendo historico remoto de migrations via Session Pooler IPv4..."
          supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Dry-run pending migrations
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'apply')) }}
        shell: bash
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all

      - name: Require explicit production confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY_PRODUCTION" ]; then
            echo "Apply blocked: confirmation must be APPLY_PRODUCTION"
            exit 1
          fi

      - name: Apply pending migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
