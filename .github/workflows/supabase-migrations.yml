name: Supabase Database Control

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-migrations.yml'
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "Acao no banco"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - dry-run
          - apply
      confirmation:
        description: "Para apply em producao, digite APPLY_PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-database-control-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  database:
    name: Supabase migration control
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "ERRO: SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "ERRO: SUPABASE_DB_PASSWORD ausente"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "ERRO: SUPABASE_PROJECT_ID ausente"; exit 1; }
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "ERRO: SUPABASE_PROJECT_ID nao tem o formato esperado de project ref (20 caracteres alfanumericos)."
            exit 1
          fi
          echo "Secrets presentes e Project ID com formato valido."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        shell: bash
        run: supabase --version

      - name: Validate access token
        shell: bash
        run: |
          set -euo pipefail
          echo "Validando autenticacao do SUPABASE_ACCESS_TOKEN..."
          if ! supabase projects list --output json > /tmp/supabase-projects.json; then
            echo "ERRO: o SUPABASE_ACCESS_TOKEN nao autenticou na Supabase CLI. Gere/atualize o token e tente novamente."
            exit 1
          fi
          echo "Token autenticado com sucesso."

      - name: Validate target project visibility
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e --arg ref "$SUPABASE_PROJECT_ID" 'any(.[]; (.id // .ref // .project_ref) == $ref)' /tmp/supabase-projects.json >/dev/null; then
            echo "ERRO: o projeto configurado em SUPABASE_PROJECT_ID nao esta visivel para o token informado."
            echo "Confira se o token pertence a mesma conta/organizacao do projeto Atlas One e se o Project ID foi atualizado no secret."
            exit 1
          fi
          echo "Projeto alvo encontrado na conta autenticada."

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          echo "Conectando a CLI ao projeto configurado..."
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID"; then
            echo "ERRO: falha no supabase link. Como token e Project ID ja foram validados, a causa mais provavel e SUPABASE_DB_PASSWORD incorreta/desatualizada ou indisponibilidade de conexao com o banco."
            exit 1
          fi
          echo "Projeto vinculado com sucesso."

      - name: Audit migration history
        shell: bash
        run: |
          set -euo pipefail
          echo "Lendo historico remoto de migrations..."
          supabase migration list

      - name: Dry-run pending migrations
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'apply') }}
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Require explicit production confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY_PRODUCTION" ]; then
            echo "Apply blocked: confirmation must be APPLY_PRODUCTION"
            exit 1
          fi

      - name: Apply pending migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        run: supabase db push --linked
