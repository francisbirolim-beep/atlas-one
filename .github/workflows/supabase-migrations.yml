name: Supabase Database Control

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-migrations.yml'
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "Acao no banco"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - dry-run
          - apply
      confirmation:
        description: "Para apply em producao, digite APPLY_PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-database-control-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  database:
    name: Supabase migration control
    runs-on: ubuntu-latest
    # PRs never receive production environment credentials.
    environment: ${{ github.event_name == 'pull_request' && 'database-test' || 'production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ github.event_name == 'pull_request' && secrets.SUPABASE_TEST_ACCESS_TOKEN || '' }}
      SUPABASE_DB_PASSWORD: ${{ github.event_name == 'pull_request' && secrets.SUPABASE_TEST_DB_PASSWORD || '' }}
      SUPABASE_PROJECT_ID: ${{ github.event_name == 'pull_request' && secrets.SUPABASE_TEST_PROJECT_ID || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select production credentials for manual control only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          PRODUCTION_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "SUPABASE_ACCESS_TOKEN=$PRODUCTION_ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PASSWORD=$PRODUCTION_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "SUPABASE_PROJECT_ID=$PRODUCTION_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Reject production as the PR test target
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "ERRO: configure SUPABASE_TEST_PROJECT_ID no ambiente database-test; sem fallback de producao."; exit 1; }
          if [ "$SUPABASE_PROJECT_ID" = "urtqbvjpwnrfaayolymt" ]; then
            echo "ERRO: testes de PR nao podem usar o projeto de producao Atlas."
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "ERRO: SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "ERRO: SUPABASE_DB_PASSWORD ausente"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "ERRO: SUPABASE_PROJECT_ID ausente"; exit 1; }
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "ERRO: SUPABASE_PROJECT_ID nao tem o formato esperado de project ref (20 caracteres alfanumericos)."
            exit 1
          fi
          echo "Secrets presentes e Project ID com formato valido."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        shell: bash
        run: supabase --version

      - name: Validate access token
        shell: bash
        run: |
          set -euo pipefail
          echo "Validando autenticacao do SUPABASE_ACCESS_TOKEN..."
          if ! supabase projects list --output json > /tmp/supabase-projects.json; then
            echo "ERRO: o SUPABASE_ACCESS_TOKEN nao autenticou na Supabase CLI. Gere/atualize o token e tente novamente."
            exit 1
          fi
          echo "Token autenticado com sucesso."

      - name: Validate target project visibility
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e --arg ref "$SUPABASE_PROJECT_ID" 'any(.[]; (.id // .ref // .project_ref) == $ref)' /tmp/supabase-projects.json >/dev/null; then
            echo "ERRO: o projeto configurado em SUPABASE_PROJECT_ID nao esta visivel para o token informado."
            echo "Confira se o token pertence a mesma conta/organizacao do projeto Atlas One e se o Project ID foi atualizado no secret."
            exit 1
          fi
          echo "Projeto alvo encontrado na conta autenticada."

      - name: Build IPv4 session pooler URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os
          import urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "Session Pooler IPv4 configurado."

      - name: Audit migration history
        shell: bash
        run: |
          set -euo pipefail
          echo "Lendo historico remoto de migrations via Session Pooler IPv4..."
          supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Verify applied SQL content hashes
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'apply')) }}
        shell: bash
        run: |
          set -euo pipefail
          # Apenas o histórico aplicado, não dados de clientes nem credenciais.
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -A -t \
            -c "SELECT version || '|' || md5(array_to_string(statements, E'\\n')) FROM supabase_migrations.schema_migrations ORDER BY version" \
            > "$RUNNER_TEMP/atlas-applied-migration-hashes.txt"
          node scripts/test-supabase-remote-hashes.cjs "$RUNNER_TEMP/atlas-applied-migration-hashes.txt"

      - name: Dry-run pending migrations
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'apply')) }}
        shell: bash
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all

      # SQL suites use fixtures and can write; never execute them against production.
      - name: Test Supabase security suite (isolated PR database only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(supabase/tests/*.sql)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "ERRO: nenhuma prova SQL encontrada em supabase/tests."
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "Executando $test_file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done

      - name: Require explicit production confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY_PRODUCTION" ]; then
            echo "Apply blocked: confirmation must be APPLY_PRODUCTION"
            exit 1
          fi

      - name: Apply pending migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
