name: Supabase Database Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Acao no banco"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - dry-run
          - apply
      confirmation:
        description: "Para apply em producao, digite APPLY_PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  database:
    name: Supabase migration control
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "Missing SUPABASE_PROJECT_ID"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Audit migration history
        shell: bash
        run: supabase migration list

      - name: Dry-run pending migrations
        if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'apply' }}
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Require explicit production confirmation
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY_PRODUCTION" ]; then
            echo "Apply blocked: confirmation must be APPLY_PRODUCTION"
            exit 1
          fi

      - name: Apply pending migrations
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: supabase db push --linked
