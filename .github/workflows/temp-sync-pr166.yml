name: Temp Sync PR 166 Types

on:
  push:
    branches:
      - feat/orcamento-configuracoes-validadas
    paths:
      - '.github/workflows/temp-sync-pr166.yml'

permissions:
  contents: write

jobs:
  preserve-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve PR 166 ItemEsquadria snapshot types
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/tipos.ts')
          s = p.read_text()
          if 'configuracao_preset_id?: string | null' not in s:
              needle = "      preco_total?: number | null\n}"
              insert = """      preco_total?: number | null
      // Snapshot do fluxo Linha -> Tipologia -> Configuracao. Campos opcionais
      // preservam compatibilidade com orcamentos antigos.
      linha_id?: string | null
      linha_nome?: string | null
      tipologia_id?: string | null
      configuracao_preset_id?: string | null
      configuracao_nome?: string | null
      configuracao_validada?: boolean
      modo_configuracao?: 'rapido' | 'assistido'
      configuracao_status?: 'pendente' | 'preenchida' | 'validada'
      variaveis?: Record<string, string>
}"""
              if needle not in s:
                  raise SystemExit('ItemEsquadria insertion point not found')
              s = s.replace(needle, insert, 1)
              p.write_text(s)
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git rm .github/workflows/temp-sync-pr166.yml
          git add lib/tipos.ts
          git diff --check
          git commit -m 'chore: preservar tipos ao sincronizar PR 166'
          git push
