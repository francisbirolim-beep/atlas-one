name: Site Esquadrifácio — validação isolada

on:
  pull_request:
    paths:
      - "site-esquadrifacio/**"
      - ".github/workflows/site-esquadrifacio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar site estático sem serviços externos
        run: node site-esquadrifacio/validar-site.mjs
      - name: Testar preparação segura da publicação
        run: node site-esquadrifacio/testar-lancamento.mjs
