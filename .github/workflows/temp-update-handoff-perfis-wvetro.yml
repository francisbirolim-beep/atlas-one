name: Temp Update Handoff Profiles W.Vetro

on:
  push:
    branches:
      - chore/reconciliar-perfis-wvetro
    paths:
      - .github/workflows/temp-update-handoff-perfis-wvetro.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update handoff docs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/temp_update_handoff_perfis_wvetro.py
          rm scripts/temp_update_handoff_perfis_wvetro.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md scripts/temp_update_handoff_perfis_wvetro.py
          git diff --cached --check
          git commit -m "docs: registrar reconciliação dos perfis W.Vetro"
          git push