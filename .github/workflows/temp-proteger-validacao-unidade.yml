name: Temp Protect Pending Unit Validation

on:
  push:
    branches:
      - feat/validacao-unidade-acessorios
    paths:
      - '.github/workflows/temp-proteger-validacao-unidade.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
      SUPABASE_SECRET_KEY: build-validation-placeholder
      ANTHROPIC_API_KEY: build-validation-placeholder
      OLLAMA_DEFAULT_MODEL: llama3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply server-side protection patch
        run: python scripts/temp_proteger_validacao_unidade.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add lib/produtos.ts app/cadastro/produtos/unidades-pendentes/page.tsx
          if git diff --cached --quiet; then
            echo 'Nada para commitar.'
          else
            git commit -m 'fix: proteger validação de unidade no servidor'
            git push
          fi
