name: Patch Mobile Nav Scroll V2

on:
  push:
    branches:
      - fix/mobile-nav-sem-x-v1
    paths:
      - '.github/workflows/patch-mobile-nav-scroll-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-sem-x-v1
      - name: Ajustar barra inferior com regex
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('components/Sidebar.tsx')
          t = p.read_text(encoding='utf-8')
          pattern = r'className="fixed bottom-0 left-0 right-0 z-40 flex items-center justify-around border-t border-slate-200 bg-white px-2 py-1\.5\s+md:static md:h-screen md:w-56 md:flex-col md:items-stretch md:justify-start md:gap-0 md:border-r md:border-t-0 md:py-5"'
          replacement = 'className="fixed bottom-0 left-0 right-0 z-40 flex items-center justify-start gap-1 overflow-x-auto border-t border-slate-200 bg-white px-2 pt-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))]\\n                   md:static md:h-screen md:w-56 md:flex-col md:items-stretch md:justify-start md:gap-0 md:overflow-visible md:border-r md:border-t-0 md:py-5"'
          novo, qtd = re.subn(pattern, replacement, t, count=1)
          if qtd != 1:
              raise SystemExit(f'Esperado 1 trecho da barra; encontrados {qtd}')
          p.write_text(novo, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-one-bot"
          git config user.email "actions@github.com"
          git add components/Sidebar.tsx
          git commit -m "fix: melhorar barra inferior no celular"
          git push origin HEAD:fix/mobile-nav-sem-x-v1
