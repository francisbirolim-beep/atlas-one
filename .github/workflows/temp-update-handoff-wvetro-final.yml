name: Temp Update Handoff W.Vetro Final

on:
  push:
    branches:
      - docs/fechar-acessorios-wvetro-producao
    paths:
      - scripts/temp_update_handoff_wvetro_final.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update handoff docs
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/temp_update_handoff_wvetro_final.py ]; then
            echo "Patch script already removed; nothing to do."
            exit 0
          fi
          python scripts/temp_update_handoff_wvetro_final.py
          rm scripts/temp_update_handoff_wvetro_final.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md scripts/temp_update_handoff_wvetro_final.py
          git diff --cached --check
          git commit -m "docs: fechar reconciliação de acessórios W.Vetro em produção"
          git push
