name: Temporary agent docs - moeda BRL

on:
  push:
    branches:
      - fix/moeda-brl-reenvio-anexos

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/moeda-brl-reenvio-anexos
          fetch-depth: 0
      - name: Atualizar handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          current = Path('docs/ai-handoff/CURRENT_STATE.md')
          s = current.read_text(encoding='utf-8')
          bloco = '''\n## ATUALIZACAO — MOEDA BRL E REENVIO DE ANEXOS\n- Branch `fix/moeda-brl-reenvio-anexos`: corrige o uso de `.toFixed(2)` no card e no PDF Atlas; `2716.84` passa a ser exibido como `R$ 2.716,84`.\n- O campo `Valor total do orçamento` usa mascara monetaria: digitando `271684`, exibe `R$ 2.716,84`; o valor continua numerico no banco.\n- O PDF Atlas formata total e valores de itens no padrao brasileiro.\n- Cada anexo em andamento recebe `Enviar`; anexos finalizados recebem `Reenviar`, abrindo o WhatsApp do vendedor com o link daquele arquivo sem exigir nova finalizacao.\n- Fotos, leitura da trena, `Iniciar/Retornar orçamento` e parser do total W.Vetro nao foram alterados.\n'''
          if '## ATUALIZACAO — MOEDA BRL E REENVIO DE ANEXOS' not in s:
              current.write_text(s.rstrip() + '\n' + bloco, encoding='utf-8')

          impl = Path('docs/ai-handoff/IMPLEMENTATIONS.md')
          s = impl.read_text(encoding='utf-8')
          bloco = '''\n## Kanban — moeda BRL e reenvio individual de anexos — 2026-08-13\n- corrige card e PDF Atlas para `R$ 2.716,84` em vez de `R$ 2716.84`;\n- campo de valor passa a aceitar digitacao apenas numerica com mascara de moeda brasileira;\n- valores de itens no PDF tambem usam formatacao BRL;\n- cada anexo pode ser enviado/reententado individualmente pelo WhatsApp do vendedor.\n'''
          if '## Kanban — moeda BRL e reenvio individual de anexos' not in s:
              impl.write_text(s.rstrip() + '\n' + bloco, encoding='utf-8')

          nxt = Path('docs/ai-handoff/NEXT_TASK.md')
          s = nxt.read_text(encoding='utf-8')
          bloco = '''\n## EM VALIDACAO — MOEDA E ANEXOS\n1. Confirmar no card `R$ 2.716,84`.\n2. Confirmar no campo de valor `R$ 2.716,84`.\n3. Gerar novo PDF Atlas e confirmar `Valor total: R$ 2.716,84`.\n4. Testar `Enviar`/`Reenviar` na frente de cada anexo.\n5. Depois seguir para `Configurações -> Orçamento` e evolucao do layout profissional.\n'''
          if '## EM VALIDACAO — MOEDA E ANEXOS' not in s:
              nxt.write_text(s.rstrip() + '\n' + bloco, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md
          git commit -m "docs: registrar moeda BRL e reenvio de anexos"
          git push origin HEAD:fix/moeda-brl-reenvio-anexos
