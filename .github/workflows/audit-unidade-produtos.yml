name: Audit Produto Unidade

on:
  push:
    branches:
      - feat/unidade-operacional-pendente

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find produto unidade usages
        shell: bash
        run: |
          set -euo pipefail
          echo '=== referências a .unidade / unidade em arquivos TS/TSX relevantes ==='
          grep -RInE "(produto|p|componente)\.unidade|unidade:\s*(produto|p)\.unidade|unidade\s*\|\|" --include='*.ts' --include='*.tsx' app components lib || true
          echo '=== referências ao campo unidade em tipos/helpers de produtos ==='
          grep -RInE "unidade[:?]|\.unidade" --include='*.ts' --include='*.tsx' app components lib | head -n 300 || true
