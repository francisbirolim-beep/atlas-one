name: Temp Close Profiles Handoff

on:
  push:
    branches:
      - docs/post-pr163-merge
    paths:
      - '.github/workflows/temp-close-perfis-handoff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar handoff pós-apply
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sections = {
            'docs/ai-handoff/CURRENT_STATE.md': '''## PERFIS W.VETRO — PRODUÇÃO CONCLUÍDA — 2026-08-17\n\nA reconciliação de proveniência dos **1.307 perfis W.Vetro** está concluída em produção. Não voltar a tratar `20260817170000_reconciliar_proveniencia_perfis_wvetro_v1.sql` como pendente.\n\nApply confirmado pelo `Supabase Database Control` run **#86** (ID `32059852704`), branch `main`, commit `0b4b4a145f89bd3ad52626cd23335fb7bef2043e`, com `CONFIRMATION: APPLY_PRODUCTION`, log `Applying migration 20260817170000_reconciliar_proveniencia_perfis_wvetro_v1.sql...` e `Finished supabase db push.`.\n\nEstado consolidado:\n- fonte W.Vetro: 1.307 perfis;\n- Atlas: 1.307 perfis;\n- 1.307 códigos correspondentes;\n- 0 faltantes e 0 exclusivos Atlas;\n- 1.235 correspondências iguais;\n- 72 valores de fonte deliberadamente não promovidos por qualidade;\n- 0 divergência operacional real;\n- nenhum INSERT de perfil e nenhuma sobrescrita de nome, preço/custo, unidade operacional, peso, NCM operacional, marca, ativo, linha, cor ou ID externo.\n\nOs valores crus permanecem preservados em campos de origem. `Tamanho` da fonte não foi promovido automaticamente para tamanho operacional; NCM/fabricante suspeitos continuam pendentes conforme regras de qualidade.\n\nOs blocos abaixo que dizem que esta migration ainda está pendente são históricos e não devem orientar nova ação.\n\n''',
            'docs/ai-handoff/IMPLEMENTATIONS.md': '''## 2026-08-17 — Perfis W.Vetro: proveniência aplicada em produção\n\n- PR #163 mergeada em `main`, commit `0b4b4a145f89bd3ad52626cd23335fb7bef2043e`.\n- `Supabase Database Control` run #86 (`32059852704`) executado com `APPLY_PRODUCTION`.\n- Migration `20260817170000_reconciliar_proveniencia_perfis_wvetro_v1.sql` aplicada com sucesso (`Finished supabase db push.`).\n- 1.307 perfis reconciliados por código; 0 faltantes; 0 exclusivos; 0 divergência operacional real.\n- Proveniência W.Vetro enriquecida sem inserir perfis nem sobrescrever campos operacionais/técnicos.\n- Dados de fonte suspeitos continuam apenas como origem/pendência de validação, sem correção por suposição.\n\n''',
            'docs/ai-handoff/NEXT_TASK.md': '''## ESTADO ATUAL — PERFIS W.VETRO CONCLUÍDOS EM PRODUÇÃO — 2026-08-17\n\nA frente de perfis W.Vetro está **concluída em produção**. A migration `20260817170000_reconciliar_proveniencia_perfis_wvetro_v1.sql` foi aplicada no run #86 (`32059852704`) com `APPLY_PRODUCTION` e `Finished supabase db push.`.\n\nNão repetir auditoria, carga ou apply dos 1.307 perfis. Os trechos históricos abaixo que dizem que a migration está pendente devem ser ignorados.\n\nPróxima frente recomendada de Produtos/Engenharia:\n1. validar humanamente a unidade operacional dos 136 acessórios que permanecem com `produtos.unidade = NULL`;\n2. manter `unidade_origem` e `qtde_embalagem_origem` como dados de proveniência, sem inferir fator de conversão;\n3. só liberar cada item para fluxos técnicos/comerciais após unidade operacional validada;\n4. em paralelo, continuar Engenharia/Plano de Corte usando apenas receitas e fórmulas tecnicamente validadas, sem inventar medidas.\n\n'''
          }

          for name, section in sections.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if section.splitlines()[0] in text:
                  continue
              lines = text.splitlines(True)
              if lines:
                  text = lines[0] + '\n' + section + ''.join(lines[1:])
              else:
                  text = section
              p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md
          if git diff --cached --quiet; then
            echo 'Nada para commitar.'
          else
            git commit -m 'docs: registrar perfis W.Vetro em produção'
            git push
          fi
