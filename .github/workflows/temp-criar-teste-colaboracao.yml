name: Temp Criar Teste Colaboracao

on:
  push:
    branches:
      - chore/verificar-colaboracao-producao
    paths:
      - '.github/workflows/temp-criar-teste-colaboracao.yml'

permissions:
  contents: write

jobs:
  criar:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Build DB URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os, urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Criar tarefa e compromisso de teste
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 > /tmp/teste-colaboracao.txt <<'SQL'
          BEGIN;

          DO $$
          DECLARE
            v_francis_id uuid;
            v_francis_nome text;
            v_julio_id uuid;
            v_julio_nome text;
            v_francis_count integer;
            v_julio_count integer;
            v_coluna_id uuid;
            v_tarefa_id uuid;
            v_evento_id uuid;
            v_convite_id uuid;
          BEGIN
            SELECT count(*) INTO v_francis_count
            FROM public.usuarios
            WHERE lower(nome) LIKE '%francis%';

            SELECT count(*) INTO v_julio_count
            FROM public.usuarios
            WHERE translate(lower(nome), 'áàãâéêíóôõúüç', 'aaaaeeiooouuc') LIKE '%julio%';

            IF v_francis_count <> 1 THEN
              RAISE EXCEPTION 'Esperado exatamente 1 usuario Francis; encontrados %', v_francis_count;
            END IF;
            IF v_julio_count <> 1 THEN
              RAISE EXCEPTION 'Esperado exatamente 1 usuario Julio; encontrados %', v_julio_count;
            END IF;

            SELECT id, nome INTO v_francis_id, v_francis_nome
            FROM public.usuarios
            WHERE lower(nome) LIKE '%francis%'
            LIMIT 1;

            SELECT id, nome INTO v_julio_id, v_julio_nome
            FROM public.usuarios
            WHERE translate(lower(nome), 'áàãâéêíóôõúüç', 'aaaaeeiooouuc') LIKE '%julio%'
            LIMIT 1;

            SELECT id INTO v_coluna_id
            FROM public.tarefa_colunas
            WHERE usuario_id = v_julio_id
            ORDER BY ordem ASC, created_at ASC
            LIMIT 1;

            IF v_coluna_id IS NULL THEN
              INSERT INTO public.tarefa_colunas(usuario_id, nome, ordem)
              VALUES (v_julio_id, 'A fazer', 0)
              RETURNING id INTO v_coluna_id;
            END IF;

            IF EXISTS (
              SELECT 1 FROM public.tarefas
              WHERE usuario_id = v_julio_id
                AND titulo = '[TESTE ATLAS] Tarefa atribuída Francis → Júlio'
                AND concluida_em IS NULL
            ) THEN
              RAISE EXCEPTION 'Tarefa de teste ja existe para Julio; abortando para evitar duplicidade';
            END IF;

            INSERT INTO public.tarefas(
              usuario_id, coluna_id, titulo, descricao, data_hora, prioridade,
              solicitante_id, solicitante_nome, atribuida_em
            ) VALUES (
              v_julio_id,
              v_coluna_id,
              '[TESTE ATLAS] Tarefa atribuída Francis → Júlio',
              'Teste controlado da colaboração do Atlas One. Pode ser concluída ou excluída após a validação.',
              '2026-08-18 09:00:00-03'::timestamptz,
              'alta',
              v_francis_id,
              v_francis_nome,
              now()
            ) RETURNING id INTO v_tarefa_id;

            IF EXISTS (
              SELECT 1 FROM public.eventos
              WHERE usuario_id = v_francis_id
                AND titulo = '[TESTE ATLAS] Compromisso Francis + Júlio'
                AND data_inicio = '2026-08-18 09:00:00-03'::timestamptz
            ) THEN
              RAISE EXCEPTION 'Compromisso de teste ja existe; abortando para evitar duplicidade';
            END IF;

            INSERT INTO public.eventos(
              usuario_id, titulo, descricao, local, data_inicio, data_fim
            ) VALUES (
              v_francis_id,
              '[TESTE ATLAS] Compromisso Francis + Júlio',
              'Teste controlado de convite e notificação da agenda do Atlas One.',
              'Atlas One',
              '2026-08-18 09:00:00-03'::timestamptz,
              '2026-08-18 09:30:00-03'::timestamptz
            ) RETURNING id INTO v_evento_id;

            INSERT INTO public.evento_convidados(evento_id, usuario_id, status)
            VALUES (v_evento_id, v_julio_id, 'pendente')
            RETURNING id INTO v_convite_id;

            RAISE NOTICE 'FRANCIS=% (%)', v_francis_nome, v_francis_id;
            RAISE NOTICE 'JULIO=% (%)', v_julio_nome, v_julio_id;
            RAISE NOTICE 'TAREFA_ID=%', v_tarefa_id;
            RAISE NOTICE 'EVENTO_ID=%', v_evento_id;
            RAISE NOTICE 'CONVITE_ID=%', v_convite_id;
          END $$;

          COMMIT;

          SELECT 'tarefas_teste=' || count(*)
          FROM public.tarefas
          WHERE titulo = '[TESTE ATLAS] Tarefa atribuída Francis → Júlio';

          SELECT 'eventos_teste=' || count(*)
          FROM public.eventos
          WHERE titulo = '[TESTE ATLAS] Compromisso Francis + Júlio';

          SELECT 'notificacoes_teste=' || count(*)
          FROM public.notificacoes
          WHERE titulo LIKE '%TESTE ATLAS%'
             OR mensagem LIKE '%TESTE ATLAS%';
          SQL

      - name: Registrar resultado
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Teste controlado de colaboração — produção — 2026-08-18'
            echo
            echo 'Criado com autorização explícita do usuário.'
            echo
            echo '```text'
            cat /tmp/teste-colaboracao.txt
            echo '```'
          } > docs/tecnico/teste-colaboracao-producao-2026-08-18.md
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add docs/tecnico/teste-colaboracao-producao-2026-08-18.md
          git commit -m 'docs: registrar teste controlado de colaboracao'
          git push
