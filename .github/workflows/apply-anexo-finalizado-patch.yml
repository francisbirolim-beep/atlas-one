name: Apply Anexo Finalizado Patch

on:
  push:
    branches:
      - fix/anexo-permanente-orcamento-finalizado

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/anexo-permanente-orcamento-finalizado
      - name: Apply patch
        run: node scripts/patch-anexo-finalizado.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/system/KanbanPageFixed.tsx
          git commit -m "fix: manter anexo disponível em orçamento finalizado"
          git push origin HEAD:fix/anexo-permanente-orcamento-finalizado
