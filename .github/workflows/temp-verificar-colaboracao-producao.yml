name: Temp Verificar Colaboracao Producao

on:
  push:
    branches:
      - chore/verificar-colaboracao-producao
    paths:
      - '.github/workflows/temp-verificar-colaboracao-producao.yml'

permissions:
  contents: write
  actions: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Build DB URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os, urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Verificar ultimo workflow_dispatch de migrations
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-migrations.yml/runs?event=workflow_dispatch&branch=main&per_page=5" > /tmp/runs.json
          RUN_ID=$(jq -r '.workflow_runs[0].id // empty' /tmp/runs.json)
          test -n "$RUN_ID" || { echo "Nenhum workflow_dispatch encontrado"; exit 1; }
          RUN_NUMBER=$(jq -r '.workflow_runs[0].run_number' /tmp/runs.json)
          RUN_STATUS=$(jq -r '.workflow_runs[0].status' /tmp/runs.json)
          RUN_CONCLUSION=$(jq -r '.workflow_runs[0].conclusion' /tmp/runs.json)
          RUN_CREATED=$(jq -r '.workflow_runs[0].created_at' /tmp/runs.json)
          RUN_SHA=$(jq -r '.workflow_runs[0].head_sha' /tmp/runs.json)
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RUN_STATUS=$RUN_STATUS" >> "$GITHUB_ENV"
          echo "RUN_CONCLUSION=$RUN_CONCLUSION" >> "$GITHUB_ENV"
          echo "RUN_CREATED=$RUN_CREATED" >> "$GITHUB_ENV"
          echo "RUN_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/manual-run.log

      - name: Verificar banco em READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At > /tmp/db-check.txt <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          select 'transaction_read_only=' || current_setting('transaction_read_only');
          select 'migration=' || coalesce((select version from supabase_migrations.schema_migrations where version='20260818013000' limit 1),'AUSENTE');
          select 'tarefas_novas_colunas=' || count(*) from information_schema.columns where table_schema='public' and table_name='tarefas' and column_name in ('solicitante_id','solicitante_nome','atribuida_em','prioridade');
          select 'notificacoes_table=' || count(*) from information_schema.tables where table_schema='public' and table_name='notificacoes';
          select 'preferencias_table=' || count(*) from information_schema.tables where table_schema='public' and table_name='notificacao_preferencias';
          select 'policy_temporaria_tarefas=' || count(*) from pg_policies where schemaname='public' and tablename in ('tarefas','tarefa_colunas') and policyname='acesso_total_temporario';
          select 'policies_tarefas=' || count(*) from pg_policies where schemaname='public' and tablename='tarefas';
          select 'policies_colunas=' || count(*) from pg_policies where schemaname='public' and tablename='tarefa_colunas';
          select 'policies_notificacoes=' || count(*) from pg_policies where schemaname='public' and tablename='notificacoes';
          select 'triggers_notificacao=' || count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal and c.relname in ('tarefas','evento_convidados') and t.tgname like '%notific%';
          select 'realtime_notificacoes=' || count(*) from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='notificacoes';
          COMMIT;
          SQL

      - name: Validar resultado e registrar relatorio
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^migration=20260818013000$' /tmp/db-check.txt
          grep -q '^tarefas_novas_colunas=4$' /tmp/db-check.txt
          grep -q '^notificacoes_table=1$' /tmp/db-check.txt
          grep -q '^preferencias_table=1$' /tmp/db-check.txt
          grep -q '^policy_temporaria_tarefas=0$' /tmp/db-check.txt
          grep -q '^realtime_notificacoes=1$' /tmp/db-check.txt
          test "$RUN_STATUS" = "completed"
          test "$RUN_CONCLUSION" = "success"

          CONFIRM_STEP=$(grep -E 'Require explicit production confirmation|Apply pending migrations|Applying migration|20260818013000_colaboracao_notificacoes_v1|Finished supabase db push' /tmp/manual-run.log | tail -n 40 || true)
          test -n "$CONFIRM_STEP"

          {
            echo '# Verificação pós-apply — colaboração/notificações — 2026-08-18'
            echo
            echo 'Verificação independente, feita após autorização explícita do usuário.'
            echo
            echo '## Workflow manual'
            echo
            echo "- run: #${RUN_NUMBER} / ID ${RUN_ID}"
            echo "- status: ${RUN_STATUS}"
            echo "- conclusão: ${RUN_CONCLUSION}"
            echo "- criado em: ${RUN_CREATED}"
            echo "- head SHA: ${RUN_SHA}"
            echo
            echo 'Trechos relevantes do log:'
            echo '```text'
            printf '%s\n' "$CONFIRM_STEP"
            echo '```'
            echo
            echo '## Banco de produção — transação READ ONLY'
            echo
            echo '```text'
            cat /tmp/db-check.txt
            echo '```'
            echo
            echo 'Critérios mínimos validados: migration registrada, 4 novas colunas em tarefas, tabelas de notificações/preferências presentes, policy temporária permissiva removida e notificações presentes no Realtime.'
          } > docs/tecnico/verificacao-colaboracao-producao-2026-08-18.md

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add docs/tecnico/verificacao-colaboracao-producao-2026-08-18.md
          git commit -m 'docs: verificar colaboracao ativa em producao'
          git push
