name: Reconcile remote migrations TEMP

on:
  push:
    branches:
      - fix/balcao-fora-kanban

permissions:
  contents: write

jobs:
  reconcile:
    name: Recover exact remote migration SQL
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/balcao-fora-kanban

      - name: Build database URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os
          import urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Recover exact SQL from migration history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          recover() {
            version="$1"
            filename="$2"
            psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
              -c "select statements[1] from supabase_migrations.schema_migrations where version='${version}'" \
              > "supabase/migrations/${filename}"
            test -s "supabase/migrations/${filename}" || { echo "Migration ${version} vazia ou ausente"; exit 1; }
          }
          recover 20260826005744 20260826005744_balcao_venda_sem_estoque_v1.sql
          recover 20260826013513 20260826013513_orcamento_balcao_condicoes_comerciais_v1.sql
          recover 20260826014745 20260826014745_orcamento_balcao_local_obra_v1.sql
          recover 20260826040819 20260826040819_balcao_venda_sem_caixa_configuravel_v1.sql
          recover 20260826134514 20260826134514_isolar_balcao_do_kanban_v1.sql
          git diff --check

      - name: Commit recovered migrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-migration-reconcile"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260826005744_balcao_venda_sem_estoque_v1.sql \
                  supabase/migrations/20260826013513_orcamento_balcao_condicoes_comerciais_v1.sql \
                  supabase/migrations/20260826014745_orcamento_balcao_local_obra_v1.sql \
                  supabase/migrations/20260826040819_balcao_venda_sem_caixa_configuravel_v1.sql \
                  supabase/migrations/20260826134514_isolar_balcao_do_kanban_v1.sql
          if git diff --cached --quiet; then
            echo "Nada para reconciliar."
            exit 0
          fi
          git commit -m "db: recuperar migrations aplicadas no Supabase"
          git push origin HEAD:fix/balcao-fora-kanban
