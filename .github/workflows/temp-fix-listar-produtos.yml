name: Temp Fix Listar Produtos

on:
  push:
    branches:
      - fix/listar-todos-produtos
    paths:
      - '.github/workflows/temp-fix-listar-produtos.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
      SUPABASE_SECRET_KEY: build-validation-placeholder
      ANTHROPIC_API_KEY: build-validation-placeholder
      OLLAMA_DEFAULT_MODEL: llama3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar correção
        run: python scripts/temp_fix_listar_produtos.py
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit da correção validada
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add lib/produtos.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: paginar listagem completa de produtos'
            git push
          fi
