name: Prepare Unidade Operacional Pendente V2

on:
  push:
    branches:
      - feat/unidade-operacional-pendente

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply deterministic patch
        run: python scripts/prepare-unidade-pendente-temp.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
          SUPABASE_SECRET_KEY: build-validation-placeholder
          ANTHROPIC_API_KEY: build-validation-placeholder
          OLLAMA_DEFAULT_MODEL: llama3.1
        run: npm run build

      - name: Validate migrations on PostgreSQL 16
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql -h 127.0.0.1 -U postgres -d atlas_test <<'SQL'
          create extension if not exists pgcrypto;
          create table public.produtos (
            id uuid primary key default gen_random_uuid(),
            nome text not null,
            categoria text not null default 'outro',
            preco numeric not null default 0,
            unidade text not null default 'unidade',
            descricao text,
            ativo boolean not null default true,
            marca text,
            ncm text,
            codigo text,
            codigo_origem text,
            origem text not null default 'manual',
            id_externo_wvetro text,
            unidade_origem text,
            qtde_embalagem_origem numeric,
            dados_origem jsonb,
            status_validacao text not null default 'importado' check (status_validacao in ('importado','revisado','validado')),
            observacao_validacao text,
            ncm_origem text,
            ncm_status text not null default 'pendente' check (ncm_status in ('pendente','valido','invalido'))
          );
          create unique index uq_produtos_codigo_upper on public.produtos (upper(codigo)) where codigo is not null;
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d atlas_test -f supabase/migrations/20260817141000_carga_acessorios_wvetro_un_v1.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d atlas_test -f supabase/migrations/20260817150000_produtos_unidade_operacional_pendente_v1.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d atlas_test -f supabase/migrations/20260817151000_carga_acessorios_wvetro_unidade_pendente_v1.sql
          resultado=$(psql -h 127.0.0.1 -U postgres -d atlas_test -Atc "select count(*), count(*) filter (where unidade='UN'), count(*) filter (where unidade is null), count(distinct upper(codigo)) from public.produtos;")
          echo "Resultado: $resultado"
          test "$resultado" = "785|649|136|785"

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/prepare-unidade-pendente-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib docs supabase scripts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No final changes to commit."
            exit 0
          fi
          git commit -m "feat: suportar acessórios com unidade operacional pendente"
          git push
