name: Temporary apply validated per-item Kanban patch
on:
  push:
    branches:
      - feat/cotacao-itens-parciais-20261011
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/cotacao-itens-parciais-20261011
          fetch-depth: 1
          persist-credentials: true
      - name: Apply patch to existing sale component without replacing source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/patches/venda-obra-partial.patch
          git apply scripts/patches/venda-obra-partial.patch
          test "$(git hash-object components/clientes/VendaObraCentral.tsx)" = "732b5bdefb8f2e29a4032e673b889bee70bee06c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/clientes/VendaObraCentral.tsx
          git commit -m "fix(compras): aplicar patch de Kanban por item validado"
          git push origin HEAD:feat/cotacao-itens-parciais-20261011
