name: Temp Handoff Post PR163

on:
  push:
    branches:
      - docs/post-pr163-merge
    paths:
      - .github/workflows/temp-handoff-post-pr163.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update handoff docs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/temp_handoff_post_pr163.py
          rm scripts/temp_handoff_post_pr163.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md scripts/temp_handoff_post_pr163.py
          git diff --cached --check
          git commit -m "docs: registrar merge da reconciliação de perfis"
          git push
