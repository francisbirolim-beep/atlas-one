name: Build Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
      SUPABASE_SECRET_KEY: build-validation-placeholder
      ANTHROPIC_API_KEY: build-validation-placeholder
      OLLAMA_DEFAULT_MODEL: llama3.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Explicit TypeScript check
        run: npm run typecheck

      - name: W.Vetro technical regression
        run: npm run test:wvetro-comparador

      - name: Supplier quotation deterministic comparison
        run: npm run test:cotacao-ia

      - name: Purchases receipt and rollback safety
        run: npm run test:compras-recebimento

      - name: Venda CMV regression
        run: npm run test:venda-cmv

      - name: Venda operational flow regression
        run: npm run test:venda-fluxo

      - name: Production card measurement mapping
        run: npm run test:producao-medicao

      - name: Safe production order release
        run: npm run test:liberacao-op

      - name: Installation production-item linkage
        run: npm run test:venda-instalacao

      - name: Safe work closure and installation guard
        run: npm run test:encerramento-obra

      - name: Sale-to-work atomic association guard
        run: npm run test:venda-obra

      - name: Supabase applied migration history integrity
        run: npm run test:supabase-history

      - name: Supabase SQL source and archived differences integrity
        run: npm run test:supabase-applied

      - name: Supabase exact applied content and unapplied review
        run: npm run test:supabase-exact

      - name: Build
        run: npm run build
