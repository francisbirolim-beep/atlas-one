name: Build Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
      SUPABASE_SECRET_KEY: build-validation-placeholder
      ANTHROPIC_API_KEY: build-validation-placeholder
      OLLAMA_DEFAULT_MODEL: llama3.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Save generated package-lock
        run: cp package-lock.json /tmp/package-lock.json

      - name: Repair PR 312 branch
        if: github.event.pull_request.number == 314
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin chore/package-lock-versionado
          git checkout -B chore/package-lock-versionado origin/chore/package-lock-versionado
          rm -rf upload2
          cp /tmp/package-lock.json package-lock.json
          git add -A
          git commit -m "fix: manter somente package-lock versionado"
          git push origin HEAD:chore/package-lock-versionado

      - name: Build
        run: npm run build
