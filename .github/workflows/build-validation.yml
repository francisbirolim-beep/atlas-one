name: Build Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
      SUPABASE_SECRET_KEY: build-validation-placeholder
      ANTHROPIC_API_KEY: build-validation-placeholder
      OLLAMA_DEFAULT_MODEL: llama3.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Explicit TypeScript check
        run: npm run typecheck

      - name: W.Vetro technical regression
        run: npm run test:wvetro-comparador

      - name: Supplier quotation deterministic comparison
        run: npm run test:cotacao-ia

      - name: Venda CMV regression
        run: npm run test:venda-cmv

      - name: Venda CMV review and IA feedback
        run: npm run test:venda-cmv-revisao

      - name: CMV soft-delete and financial totals regression
        run: npm run test:cmv-exclusao

      - name: CMV launch destination classification regression
        run: npm run test:cmv-destino

      - name: CMV purchased versus received weight and value regression
        run: npm run test:cmv-pesos

      - name: CMV W.Vetro original totals and leftovers
        run: npm run test:cmv-wvetro-valores

      - name: Venda operational flow regression
        run: npm run test:venda-fluxo

      - name: Kanban and sale financial and production consistency
        run: npm run test:kanban-conciliacao

      - name: Production card measurement mapping
        run: npm run test:producao-medicao

      - name: Safe production order release
        run: npm run test:liberacao-op

      - name: Installation production-item linkage
        run: npm run test:venda-instalacao

      - name: Safe work closure and installation guard
        run: npm run test:encerramento-obra

      - name: Sale-to-work atomic association guard
        run: npm run test:venda-obra

      - name: Supabase applied migration history integrity
        run: npm run test:supabase-history

      - name: Supabase SQL source and archived differences integrity
        run: npm run test:supabase-applied

      - name: Supabase exact applied content and unapplied review
        run: npm run test:supabase-exact

      - name: Supabase live-hash guard self-test
        run: npm run test:supabase-hashes

      - name: W.Vetro per-item supervised validation
        run: npm run test:wvetro-validacao-item

      - name: W.Vetro sales price correction and import preservation
        run: npm run test:wvetro-valor-venda

      - name: IA and reports authorization regression
        run: npm run test:ia-relatorios

      - name: Build
        run: npm run build
