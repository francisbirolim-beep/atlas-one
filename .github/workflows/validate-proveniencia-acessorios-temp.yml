name: Validate Proveniencia Acessorios Temp

on:
  push:
    branches:
      - feat/reconciliar-proveniencia-acessorios-wvetro

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate audited migration and test seed
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          for filename in (
              'scripts/temp_generate_proveniencia_migration.py',
              'scripts/temp_generate_proveniencia_seed.py',
          ):
              path = Path(filename)
              text = path.read_text()
              text = text.replace(
                  'base64.b64decode(payload)',
                  "base64.b64decode(payload + '=' * (-len(payload) % 4))",
              )
              path.write_text(text)
          PY
          python scripts/temp_generate_proveniencia_migration.py
          python scripts/temp_generate_proveniencia_seed.py
          test -s supabase/migrations/20260817160000_reconciliar_proveniencia_acessorios_wvetro_v1.sql
          test -s /tmp/test_seed_acessorios_atlas_392.sql

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Validate complete accessory sequence on PostgreSQL 16
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB_ARGS=(-h 127.0.0.1 -U postgres -d atlas_test)

          psql -v ON_ERROR_STOP=1 "${DB_ARGS[@]}" -f /tmp/test_seed_acessorios_atlas_392.sql
          psql -v ON_ERROR_STOP=1 "${DB_ARGS[@]}" -f supabase/migrations/20260817141000_carga_acessorios_wvetro_un_v1.sql
          psql -v ON_ERROR_STOP=1 "${DB_ARGS[@]}" -f supabase/migrations/20260817150000_produtos_unidade_operacional_pendente_v1.sql
          psql -v ON_ERROR_STOP=1 "${DB_ARGS[@]}" -f supabase/migrations/20260817151000_carga_acessorios_wvetro_unidade_pendente_v1.sql
          psql -v ON_ERROR_STOP=1 "${DB_ARGS[@]}" -f supabase/migrations/20260817160000_reconciliar_proveniencia_acessorios_wvetro_v1.sql

          resultado=$(psql "${DB_ARGS[@]}" -Atc "
            select
              count(*) filter (where categoria='acessorio'),
              count(*) filter (where categoria='acessorio' and origem='wvetro'),
              count(*) filter (where categoria='acessorio' and origem='legado'),
              count(*) filter (where categoria='acessorio' and unidade is null),
              count(distinct upper(codigo)) filter (where categoria='acessorio')
            from public.produtos;
          ")
          echo "Totais: $resultado"
          test "$resultado" = "1177|1174|3|136|1177"

          reconciliacao=$(psql "${DB_ARGS[@]}" -Atc "
            select
              count(*) filter (where dados_origem->>'status_reconciliacao'='EXISTENTE_IGUAL'),
              count(*) filter (where dados_origem->>'status_reconciliacao'='EXISTENTE_DIVERGENTE'),
              count(*) filter (
                where dados_origem->>'status_reconciliacao'='EXISTENTE_DIVERGENTE'
                  and unidade='UN'
                  and unidade_origem in ('MT','PR','TB','BR','PT','PC')
              )
            from public.produtos
            where categoria='acessorio';
          ")
          echo "Reconciliacao: $reconciliacao"
          test "$reconciliacao" = "296|93|93"

          exclusivos=$(psql "${DB_ARGS[@]}" -Atc "
            select string_agg(codigo, ',' order by codigo)
            from public.produtos
            where categoria='acessorio' and origem='legado';
          ")
          echo "Exclusivos Atlas: $exclusivos"
          test "$exclusivos" = "TELA-1000-GALV,TELA-132,TELA-254"

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260817160000_reconciliar_proveniencia_acessorios_wvetro_v1.sql
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Migration already committed."
            exit 0
          fi
          git commit -m "feat: reconciliar proveniência de 389 acessórios W.Vetro"
          git push
