name: Temp Update Colaboracao Handoff

on:
  push:
    branches:
      - feat/colaboracao-notificacoes-v1
    paths:
      - '.github/workflows/temp-colaboracao-handoff.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/temp_append_colaboracao_handoff.py
      - name: Commit handoff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: registrar colaboração e notificações v1'
            git push
          fi
