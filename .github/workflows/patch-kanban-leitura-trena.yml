name: Patch Kanban Leitura Trena

on:
  push:
    branches:
      - feat/kanban-leitura-trena-ia

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanban-leitura-trena-ia
          fetch-depth: 0

      - name: Integrar leitura automatica no Kanban
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/system/KanbanPageFixed.tsx')
          text = path.read_text()

          import_anchor = "import { jsPDF } from 'jspdf'\n"
          import_line = "import LeituraTrenaIA from '@/components/system/LeituraTrenaIA'\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('ancora de import nao encontrada')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          gallery_anchor = """<p className=\"text-[10px] text-slate-400\">Largura e altura ficam identificadas pela foto original de cada medicao. Clique para abrir maior.</p>
          </div>
          {editando.tipo_medida === 'final' ? (
          """.replace('          ', '')

          gallery_replacement = """<p className=\"text-[10px] text-slate-400\">Largura e altura ficam identificadas pela foto original de cada medicao. Clique para abrir maior.</p>
          </div>
          {editando.tipo_medida === 'final' && (item.foto_larguras_url || item.foto_alturas_url) && (
          <LeituraTrenaIA
          item={item}
          onAtualizar={(campo, valor) => atualizarItemEdit(item.id, campo, valor)}
          />
          )}
          {editando.tipo_medida === 'final' ? (
          """.replace('          ', '')

          if '<LeituraTrenaIA' not in text:
              if gallery_anchor not in text:
                  raise SystemExit('ancora da galeria nao encontrada')
              text = text.replace(gallery_anchor, gallery_replacement, 1)

          path.write_text(text)
          PY

          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/system/KanbanPageFixed.tsx
          git commit -m "feat: ler fotos da trena e preencher medidas no Kanban"
          git push origin HEAD:feat/kanban-leitura-trena-ia
