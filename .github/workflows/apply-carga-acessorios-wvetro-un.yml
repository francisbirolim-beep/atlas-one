name: Prepare Carga Acessorios W.Vetro UN

on:
  push:
    branches:
      - feat/carga-acessorios-wvetro-un-649

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carga-acessorios-wvetro-un-649

      - name: Generate audited migration and docs
        run: python3 scripts/generate-carga-acessorios-wvetro-un.py

      - name: Remove temporary generation files
        run: |
          rm -f tmp/carga_un_00.b64 tmp/carga_un_01.b64 tmp/carga_un_02.b64 tmp/carga_un_03.b64 tmp/carga_un_04.b64 tmp/carga_un_05.b64
          rm -f scripts/generate-carga-acessorios-wvetro-un.py
          rm -f .github/workflows/apply-carga-acessorios-wvetro-un.yml
          rmdir tmp 2>/dev/null || true

      - name: Commit final migration and handoff
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: preparar carga segura de 649 acessórios W.Vetro UN"
          git push origin HEAD:feat/carga-acessorios-wvetro-un-649
