name: Apply Engenharia Modulo V1 Once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-engenharia-modulo-v1-once.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build IPv4 session pooler URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os, urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Guard exact pending migration
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=$(supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '20260811183500_engenharia_modulo_v1.sql'
          COUNT=$(echo "$OUTPUT" | grep -c '^ • ' || true)
          test "$COUNT" -eq 1 || { echo "Esperava exatamente 1 migration pendente; encontrei $COUNT"; exit 1; }

      - name: Apply exact pending migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee /tmp/migrations.txt
          grep -q '20260811183500' /tmp/migrations.txt
