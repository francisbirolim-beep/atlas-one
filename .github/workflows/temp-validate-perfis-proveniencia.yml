name: Temp Validate Profiles Provenance Migration

on:
  push:
    branches:
      - feat/proveniencia-perfis-wvetro
    paths:
      - .github/workflows/temp-validate-perfis-proveniencia.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_test
      MIGRATION: supabase/migrations/20260817170000_reconciliar_proveniencia_perfis_wvetro_v1.sql

    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets and tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "ERRO: SUPABASE_DB_PASSWORD ausente"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "ERRO: SUPABASE_PROJECT_ID ausente"; exit 1; }
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "ERRO: SUPABASE_PROJECT_ID inválido"
            exit 1
          fi
          psql --version
          test "$(sha256sum "$MIGRATION" | awk '{print $1}')" = "5e7a7973d897b0b977db39eac3fac5ccf08ae9ba3852569e7f47bb5bb5f7186a"

      - name: Build production read-only connection
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os
          import urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Export exact production profile snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          MODE=$(psql "$SUPABASE_DB_URL" --quiet --tuples-only --no-align \
            --command="begin transaction read only; select current_setting('transaction_read_only'); rollback;" \
            | tr -d '[:space:]')
          test "$MODE" = "on" || { echo "ERRO: transação de produção não está read-only"; exit 1; }

          cat > /tmp/export-perfis.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin transaction read only;
          \copy (select id, categoria, codigo, nome, unidade, peso_kg_m, ncm, marca, ativo, tamanho_barra_mm, origem, codigo_origem, unidade_origem, tamanho_barra_mm_origem, ncm_origem, dados_origem, updated_at from public.produtos where categoria = 'perfil' order by upper(trim(codigo))) to '/tmp/perfis-prod.csv' with (format csv, header true, encoding 'UTF8')
          rollback;
          SQL
          psql "$SUPABASE_DB_URL" --quiet --file=/tmp/export-perfis.sql

          ROWS=$(python - <<'PY'
          import csv
          with open('/tmp/perfis-prod.csv', newline='', encoding='utf-8') as f:
              print(max(sum(1 for _ in csv.reader(f)) - 1, 0))
          PY
          )
          test "$ROWS" = "1307" || { echo "ERRO: snapshot exportou $ROWS linhas"; exit 1; }
          echo "Snapshot de produção exportado em read-only: $ROWS perfis."
          sha256sum /tmp/perfis-prod.csv

      - name: Upload current read-only snapshot for drift diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: perfis-prod-drift-diagnostico
          path: /tmp/perfis-prod.csv
          retention-days: 1
          if-no-files-found: error

      - name: Create ephemeral Atlas products table
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists public;
          create table public.produtos (
            id uuid primary key,
            categoria text,
            codigo text,
            nome text,
            unidade text,
            peso_kg_m numeric,
            ncm text,
            marca text,
            ativo boolean,
            tamanho_barra_mm numeric,
            origem text,
            codigo_origem text,
            unidade_origem text,
            tamanho_barra_mm_origem numeric,
            ncm_origem text,
            dados_origem jsonb,
            updated_at timestamptz
          );
          SQL
          psql "$LOCAL_DB_URL" --set=ON_ERROR_STOP=1 \
            --command="\copy public.produtos (id,categoria,codigo,nome,unidade,peso_kg_m,ncm,marca,ativo,tamanho_barra_mm,origem,codigo_origem,unidade_origem,tamanho_barra_mm_origem,ncm_origem,dados_origem,updated_at) from '/tmp/perfis-prod.csv' with (format csv, header true, encoding 'UTF8')"
          test "$(psql "$LOCAL_DB_URL" -Atc "select count(*) from public.produtos where categoria='perfil'")" = "1307"

      - name: Execute full migration only on ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" --set=ON_ERROR_STOP=1 --file="$MIGRATION"

      - name: Verify ephemeral result
        shell: bash
        run: |
          set -euo pipefail
          TOTAL=$(psql "$LOCAL_DB_URL" -Atc "select count(*) from public.produtos where categoria='perfil' and origem='wvetro'")
          test "$TOTAL" = "1307" || { echo "ERRO: origem wvetro em $TOTAL perfis"; exit 1; }
          PROMOVIDOS=$(psql "$LOCAL_DB_URL" -Atc "select count(*) from public.produtos where categoria='perfil' and tamanho_barra_mm is not null")
          test "$PROMOVIDOS" = "0" || { echo "ERRO: tamanho operacional promovido em $PROMOVIDOS perfis"; exit 1; }
          ORIGEM_SIZE=$(psql "$LOCAL_DB_URL" -Atc "select count(*) from public.produtos where categoria='perfil' and tamanho_barra_mm_origem is not null")
          test "$ORIGEM_SIZE" = "1307" || { echo "ERRO: tamanho de origem incompleto: $ORIGEM_SIZE"; exit 1; }
          echo "Migration completa validada em PostgreSQL efêmero: 1307 perfis, zero promoção de tamanho operacional."
