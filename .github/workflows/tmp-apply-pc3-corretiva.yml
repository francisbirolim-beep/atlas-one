name: TEMP Apply PC3 Corretiva

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review

permissions:
  contents: read

env:
  EXPECTED_MIGRATION: 20260819062000_corrigir_pc3_suprema_cadastro_v1.sql

jobs:
  apply-pc3:
    if: ${{ github.event.action == 'ready_for_review' && github.head_ref == 'ops/apply-pc3-corretiva-20260819' }}
    name: Apply autorizado PC3
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secrets e alvo
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"
          test -f "supabase/migrations/${EXPECTED_MIGRATION}"
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "Project ID invalido"
            exit 1
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar projeto autenticado
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list --output json > /tmp/projects.json
          jq -e --arg ref "$SUPABASE_PROJECT_ID" 'any(.[]; (.id // .ref // .project_ref) == $ref)' /tmp/projects.json >/dev/null

      - name: Montar URL IPv4
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os
          import urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Auditar fila completa
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all 2>&1 | tee /tmp/dry-run.txt
          mapfile -t pending < <(grep -Eo '[0-9]{14}_[A-Za-z0-9_]+\.sql' /tmp/dry-run.txt | sort -u)
          echo "Pendentes detectadas: ${pending[*]:-nenhuma}"
          if [ "${#pending[@]}" -ne 1 ]; then
            echo "ABORTADO: esperado exatamente 1 migration pendente."
            exit 1
          fi
          if [ "${pending[0]}" != "$EXPECTED_MIGRATION" ]; then
            echo "ABORTADO: migration pendente diferente da autorizada: ${pending[0]}"
            exit 1
          fi

      - name: Aplicar somente a fila auditada
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - name: Confirmar migration remota
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee /tmp/migrations-after.txt
          if ! grep -q '20260819062000.*20260819062000' /tmp/migrations-after.txt; then
            echo "Pos-check falhou: migration 20260819062000 nao aparece aplicada no remoto."
            exit 1
          fi
          echo "Apply PC3 concluido e migration confirmada no remoto."
