name: Temp Validate Colaboracao UI

on:
  push:
    branches:
      - feat/colaboracao-notificacoes-v1
    paths:
      - '.github/workflows/temp-colaboracao-build.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
      SUPABASE_SECRET_KEY: build-validation-placeholder
      ANTHROPIC_API_KEY: build-validation-placeholder
      OLLAMA_DEFAULT_MODEL: llama3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply UI patches
        shell: bash
        run: |
          set +e
          { python scripts/temp_patch_colaboracao_ui.py && python scripts/temp_patch_colaboracao_ui_extra.py; } 2>&1 | tee /tmp/patch.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/patch.log scripts/temp-colaboracao-build.log
            git config user.name 'atlas-one-bot'
            git config user.email 'atlas-one-bot@users.noreply.github.com'
            git add scripts/temp-colaboracao-build.log
            git commit -m 'chore: registrar erro temporario da colaboracao' || true
            git push || true
            exit "$STATUS"
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and commit result
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/build.log scripts/temp-colaboracao-build.log
            git add scripts/temp-colaboracao-build.log
            git commit -m 'chore: registrar erro temporario do build de colaboracao' || true
            git push || true
            exit "$STATUS"
          fi
          git diff --check
          git add lib/tipos.ts components/system/HomeOperationsWorkspace.tsx app/tarefas/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat: permitir atribuir tarefas entre usuarios'
            git push
          fi
