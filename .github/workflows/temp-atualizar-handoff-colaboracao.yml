name: Temp Atualizar Handoff Colaboracao

on:
  push:
    branches:
      - chore/verificar-colaboracao-producao
    paths:
      - '.github/workflows/temp-atualizar-handoff-colaboracao.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar handoffs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
            'docs/ai-handoff/CURRENT_STATE.md': '''\n\n## COLABORAÇÃO + NOTIFICAÇÕES V1 — ATIVA EM PRODUÇÃO — 2026-08-18\n\nEstado mais recente, que substitui a seção anterior desta frente:\n- PR #168 mergeada em `main`; merge commit `c791d41687b117f706c0441064bbf357161d1dca`;\n- Vercel de produção do merge: `success`;\n- migration `20260818013000_colaboracao_notificacoes_v1.sql` aplicada em produção com autorização explícita do usuário;\n- Supabase Database Control manual: run #90 / ID `32089991081`;\n- confirmação `APPLY_PRODUCTION` presente no log;\n- apply executou `Applying migration 20260818013000_colaboracao_notificacoes_v1.sql...` e terminou com `Finished supabase db push.`.\n\nVerificação independente pós-apply, em transação PostgreSQL `READ ONLY`, confirmou:\n- migration `20260818013000` registrada no histórico remoto;\n- 4 novas colunas de colaboração em `tarefas`;\n- tabelas `notificacoes` e `notificacao_preferencias` presentes;\n- policy temporária permissiva `acesso_total_temporario` removida de `tarefas`/`tarefa_colunas`;\n- policies próprias ativas;\n- 2 triggers de notificação ativos (tarefa atribuída e convite de agenda);\n- `notificacoes` presente em `supabase_realtime`.\n\nRelatório: `docs/tecnico/verificacao-colaboracao-producao-2026-08-18.md`.\n\nPortanto estão ativos em produção: atribuição auditável de tarefas entre usuários, notificações persistentes/lido-não-lido, preferência de som, alertas Realtime e notificação automática de convites de agenda. Chat e sincronização externa de calendário continuam fora desta V1.\n''',
            'docs/ai-handoff/IMPLEMENTATIONS.md': '''\n\n## Implementação — Colaboração + Notificações V1 ativa em produção — 2026-08-18\n\nPR #168 / merge `c791d41687b117f706c0441064bbf357161d1dca`. Migration `20260818013000_colaboracao_notificacoes_v1.sql` aplicada no run #90 (`32089991081`) com `APPLY_PRODUCTION`.\n\nArquitetura ativa:\n- `tarefas.usuario_id` continua sendo o responsável; `solicitante_id`, `solicitante_nome` e `atribuida_em` registram a atribuição;\n- criação cross-user ocorre via API autenticada `/api/tarefas/atribuir`, usando serviço server-side;\n- `tarefas` e `tarefa_colunas` deixaram de usar RLS permissiva e passaram a policies do próprio usuário;\n- `notificacoes` guarda destinatário, categoria, tipo, origem, criador e `lida_em`;\n- `notificacao_preferencias` guarda som/volume e categorias habilitadas;\n- triggers de banco geram notificação para tarefa atribuída e convite em agenda;\n- `notificacoes` participa do `supabase_realtime`;\n- automações de orçamento/assistência usam a API segura para destinatários diferentes do usuário atual;\n- Home e `Minhas Tarefas` permitem escolher responsável e exibem quem criou a tarefa recebida.\n\nVerificação pós-apply: `docs/tecnico/verificacao-colaboracao-producao-2026-08-18.md`.\n''',
            'docs/ai-handoff/NEXT_TASK.md': '''\n\n## COLABORAÇÃO V1 EM PRODUÇÃO — PRÓXIMOS PASSOS — 2026-08-18\n\nA colaboração de tarefas/notificações está ativa em produção; não há migration pendente desta frente.\n\nPróximos passos funcionais, em PRs separadas e pequenas:\n1. validar uso real de tarefa atribuída, convite de agenda, lido/não-lido e som entre pelo menos dois usuários;\n2. projetar chat auditável entre usuários e chat contextual por tarefa/orçamento/obra, sem reutilizar WhatsApp como banco de histórico;\n3. depois, projetar sincronização opcional de agenda externa (Google/Outlook), definindo fonte de verdade e direção da sincronização antes de implementar.\n\nFrente independente: PR #166 de orçamento por Linha/Tipologia/Configuração continua pendente e deve ser sincronizada com a `main` atual antes de novos gates/merge.\n'''
          }

          for filename, addition in updates.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              marker = addition.strip().splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Commit handoffs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: registrar colaboracao ativa em producao'
            git push
          fi
