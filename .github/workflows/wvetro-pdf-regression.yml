name: W.Vetro PDF regression

on:
  pull_request:
    paths:
      - 'lib/wvetroPdfAnexo.ts'
      - 'scripts/test-wvetro-pdf-link.cjs'
      - '.github/workflows/wvetro-pdf-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-link:
    name: Validate original PDF identification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Test PDF detection and preservation
        run: node scripts/test-wvetro-pdf-link.cjs
