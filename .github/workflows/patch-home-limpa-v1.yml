name: Patch Home Limpa V1

on:
  push:
    branches:
      - feat/home-limpa-v1
    paths:
      - '.github/workflows/patch-home-limpa-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-limpa-v1

      - name: Aplicar reorganizacao da Home
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          state_anchor = "  const [mesVisto, setMesVisto] = useState(() => { const d = new Date(); d.setDate(1); return d })\n"
          if 'mostrarCalendario' not in text:
              text = text.replace(state_anchor, state_anchor + "  const [mostrarCalendario, setMostrarCalendario] = useState(false)\n", 1)

          hoje_anchor = "  const hoje = new Date()\n"
          if 'const tarefasHojeResumo' not in text:
              resumo = """  const tarefasHojeResumo = tarefasAbertas.filter((t) => t.data_hora && mesmodia(new Date(t.data_hora), hoje))\n  const eventosHojeResumo = eventos.filter((e) => mesmodia(new Date(e.data_inicio), hoje))\n  const tarefasAtrasadasResumo = tarefasAbertas.filter(estaAtrasada)\n"""
              text = text.replace(hoje_anchor, hoje_anchor + resumo, 1)

          main_anchor = '      <main className="max-w-5xl mx-auto px-4 py-10">\n'
          if 'Visao rapida' not in text:
              bloco = '''        <section className="mb-5 grid grid-cols-3 gap-2 sm:gap-3">\n          <div className="rounded-2xl border border-slate-200 bg-white p-3 sm:p-4">\n            <p className="text-[11px] text-slate-400">Pendencias</p>\n            <p className="mt-1 text-xl font-bold text-slate-800">{tarefasAtrasadasResumo.length}</p>\n            <p className="text-[11px] text-slate-400">tarefas atrasadas</p>\n          </div>\n          <div className="rounded-2xl border border-slate-200 bg-white p-3 sm:p-4">\n            <p className="text-[11px] text-slate-400">Hoje</p>\n            <p className="mt-1 text-xl font-bold text-slate-800">{tarefasHojeResumo.length}</p>\n            <p className="text-[11px] text-slate-400">tarefas</p>\n          </div>\n          <div className="rounded-2xl border border-slate-200 bg-white p-3 sm:p-4">\n            <p className="text-[11px] text-slate-400">Agenda</p>\n            <p className="mt-1 text-xl font-bold text-slate-800">{eventosHojeResumo.length}</p>\n            <p className="text-[11px] text-slate-400">compromissos hoje</p>\n          </div>\n        </section>\n\n'''
              text = text.replace(main_anchor, main_anchor + bloco, 1)

          cal_title = '              <h2 className="text-base font-semibold text-slate-700">Calendário</h2>\n'
          if 'mostrarCalendario ? \'Ocultar\'' not in text:
              button = '''              <button\n                type="button"\n                onClick={() => setMostrarCalendario((v) => !v)}\n                className="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-medium text-brand-navy hover:bg-slate-50"\n              >\n                {mostrarCalendario ? 'Ocultar' : 'Abrir calendário'}\n              </button>\n'''
              text = text.replace(cal_title, cal_title + button, 1)

          cal_pos = text.index('>Calendário</h2>')
          detail_start_marker = '            <div className="grid grid-cols-7 gap-1 text-center mb-1">\n'
          detail_start = text.index(detail_start_marker, cal_pos)
          section_end = text.index('          </section>\n        </div>\n      </main>', detail_start)
          if '{mostrarCalendario && (' not in text[cal_pos:section_end]:
              text = text[:detail_start] + '            {mostrarCalendario && (<>\n' + text[detail_start:section_end] + '            </>)}\n' + text[section_end:]

          path.write_text(text, encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-one-bot"
          git config user.email "actions@github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: simplificar tela inicial do Atlas"
          git push origin HEAD:feat/home-limpa-v1
