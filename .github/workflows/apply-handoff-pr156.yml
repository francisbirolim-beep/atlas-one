name: Apply Handoff PR156

on:
  push:
    branches:
      - docs/post-pr156-merge

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/post-pr156-merge
      - name: Update handoff docs
        run: node scripts/patch-handoff-pr156.mjs
      - name: Commit docs
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-handoff/CURRENT_STATE.md docs/ai-handoff/IMPLEMENTATIONS.md docs/ai-handoff/NEXT_TASK.md
          git commit -m "docs: registrar auditoria de anexos da PR 156"
          git push origin HEAD:docs/post-pr156-merge
