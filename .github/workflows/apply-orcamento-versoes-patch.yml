name: Apply Orcamento Versoes Patch

on:
  push:
    branches:
      - feat/orcamento-versoes-envio

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orcamento-versoes-envio
      - name: Apply patch
        run: node scripts/patch-orcamento-versoes.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/system/KanbanPageFixed.tsx
          git commit -m "feat: versionar envios de orçamento"
          git push origin HEAD:feat/orcamento-versoes-envio
