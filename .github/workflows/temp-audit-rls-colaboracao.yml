name: Temp Audit RLS Colaboracao

on:
  push:
    branches:
      - feat/colaboracao-notificacoes-v1
    paths:
      - '.github/workflows/temp-audit-rls-colaboracao.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build DB URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os, urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Audit read-only policies and columns
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Auditoria RLS — colaboração — 2026-08-17'
            echo
            echo 'Consulta executada em transação PostgreSQL READ ONLY. Nenhum dado/schema foi alterado.'
            echo
            echo '```text'
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          select 'transaction_read_only=' || current_setting('transaction_read_only');
          select '--- POLICIES ---';
          select schemaname || '.' || tablename || ' | ' || policyname || ' | ' || cmd || ' | using=' || coalesce(qual,'') || ' | check=' || coalesce(with_check,'')
          from pg_policies
          where schemaname='public' and tablename in ('tarefas','tarefa_colunas','eventos','evento_convidados')
          order by tablename, policyname;
          select '--- COLUMNS ---';
          select table_name || ' | ' || ordinal_position || ' | ' || column_name || ' | ' || data_type || ' | nullable=' || is_nullable || ' | default=' || coalesce(column_default,'')
          from information_schema.columns
          where table_schema='public' and table_name in ('tarefas','tarefa_colunas','eventos','evento_convidados')
          order by table_name, ordinal_position;
          COMMIT;
          SQL
            echo '```'
          } > docs/tecnico/auditoria-rls-colaboracao-2026-08-17.md
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add docs/tecnico/auditoria-rls-colaboracao-2026-08-17.md
          git commit -m 'docs: auditar RLS da colaboração'
          git push
