name: Apply Engenharia Receitas Tipologia V1 Once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-engenharia-receitas-tipologia-v1-once.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Build IPv4 session pooler URL
        shell: bash
        run: |
          set -euo pipefail
          DB_URL=$(python - <<'PY'
          import os, urllib.parse
          project = os.environ['SUPABASE_PROJECT_ID']
          password = urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe='')
          print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")
          PY
          )
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Inspect target migration state
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee /tmp/dryrun.txt
          if grep -q '20260812000000_engenharia_receitas_tipologia_v1.sql' /tmp/dryrun.txt; then
            if grep -Eo '[0-9]{14}_[^ ]+\.sql' /tmp/dryrun.txt | grep -v '^20260812000000_' | grep -q .; then
              echo 'ERRO: existe outra migration pendente alem da migration alvo'
              exit 1
            fi
            echo 'should_apply=true' >> "$GITHUB_OUTPUT"
          elif grep -qi 'Remote database is up to date' /tmp/dryrun.txt; then
            echo 'should_apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ERRO: estado da migration alvo nao pôde ser determinado com segurança'
            exit 1
          fi
      - name: Apply exact pending migration
        if: steps.inspect.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee /tmp/list-final.txt
          grep -E '20260812000000.*20260812000000' /tmp/list-final.txt >/dev/null || { echo 'ERRO: migration alvo nao aparece como aplicada no historico remoto'; exit 1; }
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee /tmp/post.txt
          grep -qi 'Remote database is up to date' /tmp/post.txt || { echo 'ERRO: banco ainda possui migration pendente'; exit 1; }
