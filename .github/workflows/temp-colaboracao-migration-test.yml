name: Temp Validate Colaboracao Migration

on:
  push:
    branches:
      - feat/colaboracao-notificacoes-v1
    paths:
      - '.github/workflows/temp-colaboracao-migration-test.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap current task/event schema
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema auth;
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.role() returns text language sql stable as $$ select 'authenticated'::text $$;

          create table public.usuarios (id uuid primary key default gen_random_uuid(), nome text not null, role text);
          create table public.tarefa_colunas (
            id uuid primary key default gen_random_uuid(), usuario_id uuid not null references public.usuarios(id),
            nome text not null, ordem integer not null default 0, created_at timestamptz not null default now()
          );
          create table public.tarefas (
            id uuid primary key default gen_random_uuid(), usuario_id uuid not null references public.usuarios(id),
            coluna_id uuid not null references public.tarefa_colunas(id), titulo text not null, descricao text,
            data_hora timestamptz, concluida_em timestamptz, created_at timestamptz not null default now(),
            recorrencia_tipo text, recorrencia_valor integer, regra_origem_id uuid
          );
          alter table public.tarefas enable row level security;
          alter table public.tarefa_colunas enable row level security;
          create policy "acesso_total_temporario" on public.tarefas for all using (true) with check (true);
          create policy "acesso_total_temporario" on public.tarefa_colunas for all using (true) with check (true);

          create table public.eventos (
            id uuid primary key default gen_random_uuid(), usuario_id uuid not null references public.usuarios(id),
            titulo text not null, descricao text, local text, data_inicio timestamptz not null, data_fim timestamptz,
            created_at timestamptz not null default now(), recorrencia_tipo text, recorrencia_valor integer, regra_origem_id uuid
          );
          create table public.evento_convidados (
            id uuid primary key default gen_random_uuid(), evento_id uuid not null references public.eventos(id),
            usuario_id uuid not null references public.usuarios(id), status text not null default 'pendente', created_at timestamptz not null default now()
          );
          alter table public.eventos enable row level security;
          alter table public.evento_convidados enable row level security;
          create publication supabase_realtime;
          SQL
      - name: Execute migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260818013000_colaboracao_notificacoes_v1.sql
      - name: Test task and agenda notifications
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.usuarios(id,nome,role) values
            ('11111111-1111-1111-1111-111111111111','Francis','master'),
            ('22222222-2222-2222-2222-222222222222','Julio','funcionario');
          insert into public.tarefa_colunas(id,usuario_id,nome,ordem) values
            ('33333333-3333-3333-3333-333333333333','22222222-2222-2222-2222-222222222222','A fazer',0);
          insert into public.tarefas(
            id,usuario_id,coluna_id,titulo,solicitante_id,solicitante_nome,atribuida_em,prioridade
          ) values (
            '44444444-4444-4444-4444-444444444444','22222222-2222-2222-2222-222222222222',
            '33333333-3333-3333-3333-333333333333','Conferir orçamento',
            '11111111-1111-1111-1111-111111111111','Francis',now(),'alta'
          );
          do $$
          begin
            if (select count(*) from public.notificacoes where tipo='tarefa_atribuida') <> 1 then
              raise exception 'trigger tarefa_atribuida nao gerou exatamente 1 notificacao';
            end if;
          end $$;

          insert into public.eventos(id,usuario_id,titulo,data_inicio) values (
            '55555555-5555-5555-5555-555555555555','11111111-1111-1111-1111-111111111111','Medição obra Silva',now()+interval '1 hour'
          );
          insert into public.evento_convidados(id,evento_id,usuario_id) values (
            '66666666-6666-6666-6666-666666666666','55555555-5555-5555-5555-555555555555','22222222-2222-2222-2222-222222222222'
          );
          do $$
          begin
            if (select count(*) from public.notificacoes where tipo='convite_agenda') <> 1 then
              raise exception 'trigger convite_agenda nao gerou exatamente 1 notificacao';
            end if;
            if exists (select 1 from pg_policies where tablename in ('tarefas','tarefa_colunas') and policyname='acesso_total_temporario') then
              raise exception 'policy temporaria permissiva permaneceu ativa';
            end if;
            if not exists (select 1 from pg_publication_tables where pubname='supabase_realtime' and tablename='notificacoes') then
              raise exception 'notificacoes nao entrou no realtime';
            end if;
          end $$;
          SQL
      - name: Record success
        shell: bash
        run: |
          cat > docs/tecnico/validacao-colaboracao-ephemeral-2026-08-17.md <<'EOF'
          # Validação efêmera — colaboração/notificações — 2026-08-17

          A migration `20260818013000_colaboracao_notificacoes_v1.sql` foi executada integralmente em PostgreSQL 16 efêmero com schema mínimo equivalente às tabelas atuais auditadas.

          Validado:
          - remoção da policy temporária permissiva de `tarefas` e `tarefa_colunas`;
          - criação das novas policies próprias;
          - criação de `notificacoes` e `notificacao_preferencias`;
          - trigger de tarefa atribuída gerou exatamente uma notificação;
          - trigger de convite de agenda gerou exatamente uma notificação;
          - `notificacoes` foi adicionada à publication `supabase_realtime`.

          Nenhuma operação foi executada no banco de produção por este teste.
          EOF
          git config user.name 'atlas-one-bot'
          git config user.email 'atlas-one-bot@users.noreply.github.com'
          git add docs/tecnico/validacao-colaboracao-ephemeral-2026-08-17.md
          git commit -m 'docs: registrar validação efêmera da colaboração'
          git push
