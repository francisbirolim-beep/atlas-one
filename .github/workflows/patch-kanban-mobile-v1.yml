name: Patch Kanban Mobile V1

on:
  push:
    branches:
      - feat/kanban-mobile-v1
    paths:
      - '.github/workflows/patch-kanban-mobile-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kanban-mobile-v1

      - name: Aplicar ajustes mobile no Kanban
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/kanban/page.tsx')
          t = p.read_text(encoding='utf-8')

          replacements = [
            ('<main className="max-w-7xl mx-auto px-4 py-6">', '<main className="max-w-7xl mx-auto px-3 py-4 sm:px-4 sm:py-6">'),
            ('<div className="flex flex-wrap items-center gap-2 mb-4">', '<div className="flex flex-col sm:flex-row sm:flex-wrap sm:items-center gap-2 mb-4">'),
            ('<div className="relative flex-1 min-w-[220px]">', '<div className="relative w-full flex-1 min-w-0 sm:min-w-[220px]">'),
            ('className="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white"', 'className="w-full sm:w-auto border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white"'),
            ('<div className="flex gap-4 overflow-x-auto pb-4">', '<div className="-mx-3 flex snap-x snap-mandatory gap-3 overflow-x-auto px-3 pb-4 sm:mx-0 sm:gap-4 sm:px-0">'),
            ('className={`flex-shrink-0 w-72 bg-slate-100 rounded-2xl p-3 transition ${', 'className={`flex-shrink-0 w-[86vw] max-w-72 snap-start bg-slate-100 rounded-2xl p-3 transition ${'),
            ('className="flex-shrink-0 w-72 h-12 flex items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 text-slate-400 hover:border-brand-navy hover:text-brand-navy transition"', 'className="flex-shrink-0 w-[86vw] max-w-72 snap-start h-12 flex items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 text-slate-400 hover:border-brand-navy hover:text-brand-navy transition"'),
            ('<div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">', '<div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">'),
            ('<div className="bg-white rounded-2xl max-w-md w-full max-h-[85vh] overflow-y-auto">', '<div className="bg-white rounded-t-2xl sm:rounded-2xl max-w-md w-full max-h-[92vh] sm:max-h-[85vh] overflow-y-auto">'),
            ('<div className="grid grid-cols-2 gap-3">', '<div className="grid grid-cols-1 sm:grid-cols-2 gap-3">'),
            ('<div className="grid grid-cols-4 gap-2">', '<div className="grid grid-cols-2 sm:grid-cols-4 gap-2">'),
          ]

          for old, new in replacements:
            if old in t:
              t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-one-bot"
          git config user.email "actions@github.com"
          git add app/kanban/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: melhorar Kanban no celular"
          git push origin HEAD:feat/kanban-mobile-v1
